name: reader_nover
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
#    genera: true
    sdk: flutter
  #状态管理
  get: ^4.6.6
  #网络管理
  dio: ^5.8.0+1
  cookie_jar: ^4.0.8
  connectivity_plus: ^6.1.4
  #数据库管理 - SQLite (drift)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path: ^1.9.0
  archive: ^4.0.9
  xml: ^6.6.1
  html: ^0.15.6
  #日志
  logger: ^2.6.0
  #文件目录
  path_provider: ^2.1.3
  #文件目录
  flutter_smart_dialog: ^4.9.7+7
  #主题颜色
  flex_color_scheme: ^8.0.0
  # 国际化
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  json_annotation: ^4.9.0
  # json 转 model
  freezed_annotation: ^2.4.1
  flutter_rust_bridge: 2.10.0
  rust_lib_reader_nover:
    path: rust_builder
  # 摄像头和图像处理
  camera: ^0.10.5+2
  image: ^4.1.7
  # UI 组件
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  web_socket_channel: ^2.4.0
  # 缓存图片插件
  cached_network_image: ^3.2.3
  # 图片颜色提取
  palette_generator: ^0.3.3+4
  # 屏幕亮度控制
  screen_brightness: ^1.0.1
  # WebView 支持（用于需要 JavaScript 渲染的书源）
  flutter_inappwebview: ^6.1.5
  # 启动图标生成工具
#  flutter_launcher_icons: "^0.14.4"
  # 可滚动位置列表
  scrollable_positioned_list: ^0.3.8
  # 二维码扫描
  mobile_scanner: ^5.1.1
  # 文件选择（书源本地导入）
  file_picker: ^8.0.7
  # 分享（书源导出分享）
  share_plus: ^10.0.3
  # 文本处理
  extended_text: ^15.0.2
  # 本地存储
  shared_preferences: ^2.5.4
  # 安全存储
  flutter_secure_storage: ^9.2.4
  # 颜色选择器
  flutter_colorpicker: ^1.1.0
  # 系统 TTS
  flutter_tts: ^4.2.3
  # TTS 后台/锁屏播放音频会话
  audio_session: ^0.1.25


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  # 序列化代码生成
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  drift_dev: ^2.22.1
  # 启动页生成工具
  flutter_native_splash: ^2.4.7
  # 图标生成工具
  flutter_launcher_icons: ^0.13.1
  intl_utils: ^2.8.10


flutter:
  config:
    enable-lldb-debugging: false
  uses-material-design: true
  fonts:
    # 精简字体：只保留常用字重，减少约 30MB
    - family: 细行楷
      fonts:
        - asset: fonts/细行楷/汉仪细行楷简.ttf
  assets:
    - assets/image/default/
    - assets/
    - assets/image/
    - assets/json/
    - assets/image/splash/

flutter_intl:
  enabled: true
  class_name: S
  main_locale: zh
  arb_dir: lib/app/l10n
  output_dir: lib/app/l10n/generated


flutter_icons:
  ios: true
  android: true
  image_path: assets/image/default/icon_app.png
